spring.application.name=school_management

server.port=8080

# Database Configuration (Fixed the typo here)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/kghs
spring.datasource.username=postgres
spring.datasource.password=2580

# JPA / Hibernate Configuration
# Note: changed database-platform to a modern PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Naming Strategies
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.open-in-view=false


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


spring.servlet.multipart.file-size-threshold=1B


